apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: enterprise-ai-ingress

spec:
  rules:

  - host: enterprise-ai.local

    http:

      paths:

      - path: /search
        pathType: Prefix

        backend:
          service:
            name: search-service

            port:
              number: 80

      - path: /inventory
        pathType: Prefix

        backend:
          service:
            name: inventory-service

            port:
              number: 80

      - path: /agents
        pathType: Prefix

        backend:
          service:
            name: agents-service

            port:
              number: 80

      - path: /governance
        pathType: Prefix

        backend:
          service:
            name: governance-service

            port:
              number: 80